[package]
name = "eupho"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A GitHub-native control plane for swappable coding agents"
publish = false

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
fs4 = "1.1.0"
hmac = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
